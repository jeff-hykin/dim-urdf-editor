name: dim-urdf-editor
install: nix run .#install
apps:
    - name: urdf_view
      title: URDF Editor
      icon: dim/apps/urdf_view/frontend/icon.svg
      frontend: dim/apps/urdf_view/frontend
      backend:
          dim_app: dim/apps/urdf_view/main.js
requires:
    dimos-desktop:
        version: ">=0.2.0"
        apis: { app.frontend: 1, app.dim_app: 1 }
